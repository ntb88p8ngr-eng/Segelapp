services:
  segelapp:
    build:
      context: .
      args:
        # Nur nötig, wenn die Seite unter einem Unterpfad läuft, z. B.
        # "/segelapp". Das Präfix muss beim Bauen bekannt sein.
        #
        # Der Wert steht bewusst nicht hier, sondern kommt aus der Umgebung —
        # sonst wäre er bei jedem "git pull" wieder überschrieben. Dauerhaft
        # eintragen in die Datei ".env" neben dieser Datei:
        #   NEXT_PUBLIC_BASE_PATH=/segelapp
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
        # Zeigt das Commit-Kürzel in der Fusszeile. Aufruf dann:
        #   NEXT_PUBLIC_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        NEXT_PUBLIC_COMMIT: "${NEXT_PUBLIC_COMMIT:-}"
    restart: unless-stopped

    # Nur lokal veröffentlichen — der Zugriff von aussen läuft über Traefik
    # (siehe die Labels unten), nicht über diesen Port.
    ports:
      - "127.0.0.1:3000:3000"

    # Zugangsdaten (iCloud, Wassertemperatur …). Datei anlegen, notfalls leer:
    #   cp .env.example segelapp.env
    env_file:
      - path: ./segelapp.env
        required: false

    volumes:
      # Ohne dieses Volume wären die gemeinsamen Wegpunkte nach jedem
      # "docker compose up --build" verschwunden.
      - waypoints:/data

    # Bindet den Dienst an den vorhandenen Traefik-Container. Ohne das
    # externe Netzwerk "web" (aus dem Traefik-eigenen docker-compose.yml)
    # kann Traefik diesen Container nicht erreichen.
    networks:
      - default
      - web

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.segelapp.loadbalancer.server.port=3000"

      # PathPrefix schneidet den Pfad NICHT ab — die Seite bekommt "/segelapp"
      # weiterhin vollständig zu sehen, wie es NEXT_PUBLIC_BASE_PATH erwartet.
      #
      # Domain und Priorität an die eigene Umgebung anpassen: Ohne eine
      # Priorität, die über der des Nextcloud-Routers liegt (dort explizit
      # auf 1 gesetzt, ohne PathPrefix — der matcht sonst zuerst und fängt
      # auch diese Anfragen ab), würde Nextcloud weiterhin alles beantworten.
      - "traefik.http.routers.segelapp.rule=Host(`6idioten.ddns.net`) && PathPrefix(`/segelapp`)"
      - "traefik.http.routers.segelapp.entrypoints=websecure"
      - "traefik.http.routers.segelapp.tls.certresolver=leresolver"
      - "traefik.http.routers.segelapp.priority=10"

networks:
  web:
    external: true

volumes:
  waypoints:
